<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Claude大小姐 设置</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="common.css">
<style>
  body { background: var(--bg-soft); }
  #root { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  h3 { margin: 0 0 8px 4px; font-size: 13px; }
  .group { background: var(--card); border: 1px solid var(--card-stroke); border-radius: 10px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 42px; }
  .item + .item { border-top: 1px solid var(--card-stroke); }
  .item > label:first-child { flex: 1; }
  .item .sw { flex: none; width: 38px; }
  input[type=range] { width: 170px; accent-color: var(--accent); }
  .val { width: 64px; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .sw { position: relative; width: 38px; height: 22px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: var(--track); border-radius: 99px; transition: .15s; cursor: pointer; }
  .sw span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .sw input:checked + span { background: var(--accent); }
  .sw input:checked + span::after { transform: translateX(16px); }
</style>
</head>
<body>
<div id="root">
  <div><h3>外观</h3><div class="group">
    <div class="item"><label>大小</label><input type="range" data-k="scale" min="0.6" max="1.6" step="0.05"><span class="val" data-v="scale"></span></div>
    <div class="item"><label>透明度</label><input type="range" data-k="opacity" min="0.3" max="1" step="0.05"><span class="val" data-v="opacity"></span></div>
    <div class="item" id="figRow"><label>形象</label><select data-k="figure"><option value="stickers">表情头像</option><option value="v3">v3 小人</option></select></div>
    <div class="item"><label>表情轮换间隔</label><input type="range" data-k="rotateSeconds" min="5" max="120" step="1"><span class="val" data-v="rotateSeconds"></span></div>
    <div class="item"><label>偶尔说句话</label><label class="sw"><input type="checkbox" data-k="chatter"><span></span></label></div>
    <div class="item"><label>说话频率</label><select data-k="chatterSeconds"><option value="90">安静（约 90 秒一句）</option><option value="30">适中（约 30 秒一句）</option><option value="15">话痨（约 15 秒一句）</option></select></div>
    <div class="item"><label>和另一只桌宠偶尔聊天</label><label class="sw"><input type="checkbox" data-k="petChat"><span></span></label></div>
  </div></div>
  <div><h3>什么时候出现</h3><div class="group">
    <div class="item"><label><span class="host">Claude</span> 在前台时才显示</label><label class="sw"><input type="checkbox" data-k="onlyWithClaude"><span></span></label></div>
    <div class="item"><label><span class="host">Claude</span> 全屏时隐藏</label><label class="sw"><input type="checkbox" data-k="hideInFullscreen"><span></span></label></div>
    <div class="item"><label>开机自动启动</label><label class="sw"><input type="checkbox" data-k="launchAtLogin"><span></span></label></div>
  </div></div>
  <div><h3>提醒</h3><div class="group">
    <div class="item"><label>会话等你批准或回复时提醒</label><label class="sw"><input type="checkbox" data-k="alertWaiting"><span></span></label></div>
    <div class="item"><label>桌宠隐藏时用系统通知提醒</label><label class="sw"><input type="checkbox" data-k="notifications"><span></span></label></div>
    <div class="item"><label>连续使用 2 小时提醒起来活动</label><label class="sw"><input type="checkbox" data-k="sitReminder"><span></span></label></div>
    <div class="item"><label>凌晨 0–5 点还在用时提醒睡觉</label><label class="sw"><input type="checkbox" data-k="nightReminder"><span></span></label></div>
    <div class="item"><label>专注时长</label><input type="range" data-k="focusMinutes" min="10" max="60" step="5"><span class="val" data-v="focusMinutes"></span></div>
  </div></div>
  <div class="row"><span class="spacer"></span><button class="btn" id="reset">恢复默认</button></div>
</div>
<script>
  const fmt = { scale: (v) => `${Math.round(v * 100)}%`, opacity: (v) => `${Math.round(v * 100)}%`, rotateSeconds: (v) => `约 ${v} 秒`, focusMinutes: (v) => `${v} 分钟` };
  let dragging = false;
  window.pet.onState((s) => {
    if (dragging) return;
    if (s.petName) document.title = `${s.petName} 设置`;
    document.querySelectorAll('.host').forEach((el) => { el.textContent = s.hostName || 'Claude'; });
    document.getElementById('figRow').style.display = s.hasStickers === false ? 'none' : '';
    document.querySelectorAll('[data-k]').forEach((el) => {
      const v = s.settings[el.dataset.k];
      if (el.type === 'checkbox') el.checked = !!v; else el.value = String(v);
    });
    document.querySelectorAll('[data-v]').forEach((el) => { el.textContent = fmt[el.dataset.v](s.settings[el.dataset.v]); });
  });
  document.querySelectorAll('[data-k]').forEach((el) => {
    if (el.tagName === 'SELECT') el.addEventListener('change', () => window.pet.act('setSetting', el.dataset.k, el.value));
    else if (el.type === 'checkbox') el.addEventListener('change', () => window.pet.act('setSetting', el.dataset.k, el.checked));
    else {
      el.addEventListener('input', () => {
        dragging = true;
        document.querySelector(`[data-v="${el.dataset.k}"]`).textContent = fmt[el.dataset.k](+el.value);
        window.pet.act('setSetting', el.dataset.k, +el.value);
      });
      el.addEventListener('change', () => { dragging = false; });
    }
  });
  document.getElementById('reset').addEventListener('click', () => window.pet.act('resetSettings'));
</script>
</body>
</html>
